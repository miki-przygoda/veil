# Linux only. Build both images, then start veild:
#
#   docker pull alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
#   docker compose -f deploy/docker-compose.yml --profile images build
#   docker compose -f deploy/docker-compose.yml up -d
#
# The dashboard is then on http://127.0.0.1:8080 on the host. On a legacy-
# iptables host add `-f deploy/docker-compose.legacy.yml` to every command (and
# IPTABLES_BACKEND=legacy to the build); host prep is in the README's Docker
# Compose section (kernel modules, iptables version skew).
services:
  veild:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      # Must match the host's iptables backend (see deploy/Dockerfile).
      args:
        IPTABLES_BACKEND: ${IPTABLES_BACKEND:-nft}
    image: veil:dev
    # The host network namespace, because everything veild observes with lives
    # there: the resolver binds :53 on the veil-net gateway, the packet tap opens
    # AF_PACKET on veil-br0, and the honeypot's nat REDIRECT goes into the host's
    # netfilter. In a bridged netns all three fall back and escape detection goes
    # dark. There is no port mapping and no -listen override: veild's default
    # -listen=127.0.0.1:8080 is now host loopback. Never pass -listen=:8080 here —
    # on the host network that binds the veil-net gateway too, and the subject
    # could read the observer feed (invariant #1).
    network_mode: host
    # Root in the container (see deploy/Dockerfile) with every capability
    # dropped except the three it needs: NET_ADMIN (honeypot iptables),
    # NET_RAW (AF_PACKET tap, iptables), NET_BIND_SERVICE (resolver on :53).
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW, NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    # veild drives Docker on the host; without this the container backend fails
    # closed. Root owns the socket, so no group_add/DOCKER_GID is needed. This
    # is root-equivalent access to the host: veild is the trusted control plane.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Optional subject. Only passed through when set in the invoking shell: no
    # value here, so an unset key stays unset in the container and is never
    # written into the image. Read only by -subject-brain=claude. Enabling a
    # subject (a -subject script or -subject-goal) is a `command:` override in a
    # docker-compose.override.yml; see the README. veild's flag defaults keep it
    # off.
    environment:
      - ANTHROPIC_API_KEY
      - VEIL_SUBJECT_MODEL
    # SIGTERM starts veild's bounded teardown, and compose's 10s default would
    # SIGKILL it partway, leaking the box, residents and nat rules until the next
    # start's reconcile. Worst case, with every bound hit (cmd/veild/main.go):
    # viz shutdown 5s + destroyBox 10s + Fleet.Down 10s + honeypot iptables
    # (~4 calls x -w 3s = 12s) + tap 2s + fabric teardown 10s = 49s. A clean
    # stop takes a few seconds; 60s covers the worst case with margin.
    stop_grace_period: 60s
    restart: unless-stopped

  # Build-only: the veil-resident:dev image the resident fleet (veild) starts on
  # veil-net. veild creates those containers itself through the Docker API, so
  # compose must never run this service; the "images" profile keeps it out of a
  # plain `up`. Without the image every resident fails and veild falls back to
  # synthetic bus-only residents.
  resident:
    profiles: [images]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.resident
    image: veil-resident:dev
